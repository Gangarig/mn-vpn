<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutag</title><link rel="stylesheet" href="popup.css"><body><main><div class="brand"><i></i>Nutag</div><p id="message">Sign in to manage your demo connection.</p><form id="auth"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="6" autocomplete="current-password"></label><button>Log in</button><button type="button" id="signup" class="secondary">Create account</button></form><section id="dashboard" hidden><p id="account"></p><div class="status"><i id="dot"></i><span id="state">Disconnected</span></div><button id="toggle">Connect</button><p class="note">Demo state only. Traffic routing is coming soon.</p><button id="logout" class="secondary">Log out</button></section></main><script src="popup.js"></script></body></html>
